<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🚗 Sistema Vehicular NFC - Completo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #1a2980, #26d0ce);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #2c3e50, #34495e);
            color: white;
            padding: 25px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2rem;
            margin-bottom: 10px;
        }
        
        .header p {
            opacity: 0.9;
            font-size: 1rem;
        }
        
        .badge {
            display: inline-block;
            background: linear-gradient(135deg, #8A2387, #E94057);
            color: white;
            padding: 8px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            margin-top: 10px;
        }
        
        .content {
            padding: 25px;
        }
        
        .panel {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid #e9ecef;
        }
        
        h2 {
            color: #2c3e50;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .form-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #2c3e50;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 2px solid #dee2e6;
            border-radius: 5px;
            font-size: 1rem;
        }
        
        input:focus, textarea:focus {
            outline: none;
            border-color: #3498db;
        }
        
        textarea {
            min-height: 80px;
            resize: vertical;
        }
        
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 5px;
        }
        
        .btn-nfc {
            background: linear-gradient(135deg, #8A2387, #E94057);
            color: white;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
        }
        
        .btn-success {
            background: linear-gradient(135deg, #27ae60, #219653);
            color: white;
        }
        
        .btn-warning {
            background: linear-gradient(135deg, #f39c12, #e67e22);
            color: white;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin: 20px 0;
        }
        
        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 10px;
            margin-bottom: 8px;
            background: white;
            border-radius: 5px;
            border-left: 4px solid #3498db;
        }
        
        .nfc-status {
            background: #e8f4f8;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: center;
        }
        
        .resultado {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 5px;
            margin-top: 15px;
            display: none;
        }
        
        .resultado.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .resultado.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        
        @media (max-width: 600px) {
            .grid-2 {
                grid-template-columns: 1fr;
            }
            
            .btn {
                width: 100%;
                margin: 5px 0;
            }
            
            .buttons {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚗 Sistema Vehicular NFC</h1>
            <p>Guarda y lee datos de tu vehículo en llaveros NFC</p>
            <div class="badge">📱 100% HTML - Guarda como archivo y ábrelo</div>
        </div>
        
        <div class="content">
            <!-- Panel de Datos -->
            <div class="panel">
                <h2>📝 Datos del Vehículo</h2>
                
                <div class="form-group">
                    <label>🚘 Matrícula:</label>
                    <input type="text" id="matricula" placeholder="Ej: 1234 ABC" value="4567 XYZ">
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>🛣️ Kilómetros:</label>
                        <input type="number" id="kilometros" value="125430">
                    </div>
                    <div class="form-group">
                        <label>⛽ Litros repostados:</label>
                        <input type="number" step="0.1" id="litros" value="42.5">
                    </div>
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>✅ Próxima ITV:</label>
                        <input type="date" id="itv" value="2024-12-15">
                    </div>
                    <div class="form-group">
                        <label>🛡️ Vencimiento Seguro:</label>
                        <input type="date" id="seguro" value="2024-11-30">
                    </div>
                </div>
                
                <div class="form-group">
                    <label>📝 Notas:</label>
                    <textarea id="notas" placeholder="Observaciones importantes...">Próximo cambio de filtro de aire. Revisar amortiguadores.</textarea>
                </div>
            </div>
            
            <!-- Panel de Estado NFC -->
            <div class="panel">
                <div class="nfc-status">
                    <h3>🔓 Estado del Sistema NFC</h3>
                    <p id="nfcStatus">Comprobando compatibilidad...</p>
                    <small id="nfcDetail">Esta función requiere Chrome en Android</small>
                </div>
            </div>
            
            <!-- Panel de Botones -->
            <div class="panel">
                <h2>⚡ Acciones</h2>
                
                <div class="buttons">
                    <button class="btn btn-nfc" onclick="guardarNFC()">
                        💾 GUARDAR en NFC
                    </button>
                    <button class="btn btn-primary" onclick="leerNFC()">
                        📖 LEER de NFC
                    </button>
                </div>
                
                <div class="buttons">
                    <button class="btn btn-success" onclick="exportarJSON()">
                        ⬇️ EXPORTAR JSON
                    </button>
                    <button class="btn btn-warning" onclick="importarJSON()">
                        ⬆️ IMPORTAR JSON
                    </button>
                    <button class="btn" onclick="limpiarDatos()" style="background: #95a5a6; color: white;">
                        🗑️ LIMPIAR
                    </button>
                </div>
            </div>
            
            <!-- Panel de Resultados -->
            <div class="panel">
                <h2>📊 Datos Actuales</h2>
                <div id="datosContainer">
                    <!-- Los datos se mostrarán aquí -->
                </div>
                
                <div id="resultado" class="resultado"></div>
            </div>
        </div>
    </div>

    <script>
        // ==================== VARIABLES GLOBALES ====================
        let nfcCompatible = false;
        let nfcPermitido = false;
        
        // ==================== INICIALIZACIÓN ====================
        document.addEventListener('DOMContentLoaded', function() {
            // 1. Comprobar NFC
            comprobarNFC();
            
            // 2. Cargar datos guardados
            cargarDatosGuardados();
            
            // 3. Mostrar datos iniciales
            mostrarDatos();
            
            // 4. Guardar automáticamente al cambiar
            ['matricula', 'kilometros', 'litros', 'itv', 'seguro', 'notas'].forEach(id => {
                document.getElementById(id).addEventListener('change', function() {
                    guardarEnLocalStorage();
                    mostrarDatos();
                });
            });
        });
        
        // ==================== FUNCIÓN IMPORTAR (LA QUE FALTABA) ====================
        function importarJSON() {
            // Crear input de archivo
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json,application/json';
            
            // Cuando se seleccione un archivo
            input.onchange = function(event) {
                const file = event.target.files[0];
                if (!file) return;
                
                const reader = new FileReader();
                
                reader.onload = function(e) {
                    try {
                        // 1. Leer y parsear JSON
                        const datos = JSON.parse(e.target.result);
                        
                        // 2. Validar que sean datos de vehículo
                        if (!datos.matricula && !datos.kilometros) {
                            throw new Error("Archivo JSON no válido para vehículo");
                        }
                        
                        // 3. Cargar datos en el formulario
                        cargarDatosEnFormulario(datos);
                        
                        // 4. Guardar en localStorage
                        guardarEnLocalStorage();
                        
                        // 5. Mostrar éxito
                        mostrarResultado(`✅ Datos importados correctamente desde: ${file.name}`, 'success');
                        
                        // 6. Mostrar datos actualizados
                        mostrarDatos();
                        
                    } catch (error) {
                        console.error("Error importando:", error);
                        mostrarResultado(`❌ Error importando: ${error.message}`, 'error');
                    }
                };
                
                reader.onerror = function() {
                    mostrarResultado("❌ Error leyendo el archivo", 'error');
                };
                
                reader.readAsText(file);
            };
            
            // Hacer clic en el input
            input.click();
        }
        
        // ==================== COMPROBAR NFC ====================
        function comprobarNFC() {
            if ('NDEFReader' in window) {
                nfcCompatible = true;
                document.getElementById('nfcStatus').innerHTML = 
                    '<span style="color: #27ae60;">✅ NFC COMPATIBLE</span>';
                document.getElementById('nfcDetail').textContent = 
                    'Puedes guardar y leer datos en etiquetas NFC';
            } else {
                document.getElementById('nfcStatus').innerHTML = 
                    '<span style="color: #e74c3c;">❌ NFC NO COMPATIBLE</span>';
                document.getElementById('nfcDetail').innerHTML = 
                    'Usa EXPORTAR/IMPORTAR para manejar datos';
            }
        }
        
        // ==================== GUARDAR EN NFC ====================
        async function guardarNFC() {
            if (!nfcCompatible) {
                mostrarResultado("❌ NFC no compatible en este dispositivo. Exporta como JSON.", 'error');
                return;
            }
            
            try {
                // 1. Obtener datos
                const datos = obtenerDatosDelFormulario();
                const jsonDatos = JSON.stringify(datos);
                
                console.log("Guardando en NFC:", datos);
                console.log("Tamaño JSON:", jsonDatos.length, "bytes");
                
                // 2. Mostrar mensaje de espera
                mostrarResultado("🔍 Acerca un llavero NFC vacío al dispositivo...", 'info');
                
                // 3. Escribir en NFC
                const ndef = new NDEFReader();
                await ndef.write({
                    records: [{
                        recordType: "mime",
                        mediaType: "application/json",
                        data: new TextEncoder().encode(jsonDatos)
                    }]
                });
                
                // 4. Mostrar éxito
                mostrarResultado(`✅ Datos guardados en NFC correctamente! (${jsonDatos.length} bytes)`, 'success');
                
            } catch (error) {
                console.error("Error NFC:", error);
                
                if (error.name === 'NotAllowedError') {
                    mostrarResultado("❌ Permiso denegado para usar NFC", 'error');
                } else if (error.name === 'NotSupportedError') {
                    mostrarResultado("❌ NFC no soportado por el dispositivo", 'error');
                } else {
                    mostrarResultado(`❌ Error NFC: ${error.message}`, 'error');
                }
                
                // Ofrecer exportar como archivo
                if (confirm('¿Quieres exportar los datos como archivo JSON?')) {
                    exportarJSON();
                }
            }
        }
        
        // ==================== LEER DE NFC ====================
        async function leerNFC() {
            if (!nfcCompatible) {
                mostrarResultado("❌ NFC no compatible en este dispositivo", 'error');
                return;
            }
            
            try {
                // 1. Mostrar mensaje de espera
                mostrarResultado("🔍 Acerca un llavero NFC con datos...", 'info');
                
                // 2. Leer de NFC
                const ndef = new NDEFReader();
                await ndef.scan();
                
                ndef.addEventListener("reading", ({message}) => {
                    // 3. Buscar datos JSON
                    for (const record of message.records) {
                        if (record.recordType === "mime" && record.mediaType === "application/json") {
                            const decoder = new TextDecoder();
                            const jsonDatos = decoder.decode(record.data);
                            
                            try {
                                // 4. Parsear y cargar datos
                                const datos = JSON.parse(jsonDatos);
                                cargarDatosEnFormulario(datos);
                                guardarEnLocalStorage();
                                
                                mostrarResultado(`✅ Datos cargados desde NFC! (${jsonDatos.length} bytes)`, 'success');
                                mostrarDatos();
                                return;
                                
                            } catch (e) {
                                console.error("Error parseando:", e);
                            }
                        }
                    }
                    mostrarResultado("⚠️ No se encontraron datos JSON en el NFC", 'info');
                });
                
                // Timeout después de 30 segundos
                setTimeout(() => {
                    mostrarResultado("⏱️ Tiempo de lectura agotado", 'info');
                }, 30000);
                
            } catch (error) {
                console.error("Error leyendo NFC:", error);
                mostrarResultado(`❌ Error leyendo NFC: ${error.message}`, 'error');
            }
        }
        
        // ==================== EXPORTAR JSON ====================
        function exportarJSON() {
            // 1. Obtener datos
            const datos = obtenerDatosDelFormulario();
            const jsonStr = JSON.stringify(datos, null, 2);
            
            // 2. Crear y descargar archivo
            const blob = new Blob([jsonStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            
            // 3. Nombre del archivo con fecha
            const fecha = new Date().toISOString().split('T')[0];
            const nombreArchivo = `vehiculo_${datos.matricula.replace(/\s/g, '_')}_${fecha}.json`;
            
            a.href = url;
            a.download = nombreArchivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            // 4. Mostrar mensaje
            mostrarResultado(`💾 Archivo "${nombreArchivo}" descargado`, 'success');
        }
        
        // ==================== FUNCIONES AUXILIARES ====================
        
        // Obtener datos del formulario
        function obtenerDatosDelFormulario() {
            return {
                matricula: document.getElementById('matricula').value,
                kilometros: parseInt(document.getElementById('kilometros').value) || 0,
                litros: parseFloat(document.getElementById('litros').value) || 0,
                itv: document.getElementById('itv').value,
                seguro: document.getElementById('seguro').value,
                notas: document.getElementById('notas').value,
                fechaActualizacion: new Date().toISOString()
            };
        }
        
        // Cargar datos en formulario
        function cargarDatosEnFormulario(datos) {
            document.getElementById('matricula').value = datos.matricula || '';
            document.getElementById('kilometros').value = datos.kilometros || '';
            document.getElementById('litros').value = datos.litros || '';
            document.getElementById('itv').value = datos.itv || '';
            document.getElementById('seguro').value = datos.seguro || '';
            document.getElementById('notas').value = datos.notas || '';
        }
        
        // Mostrar datos actuales
        function mostrarDatos() {
            const datos = obtenerDatosDelFormulario();
            const container = document.getElementById('datosContainer');
            
            // Formatear fecha si existe
            function formatearFecha(fechaStr) {
                if (!fechaStr) return 'No definida';
                try {
                    return new Date(fechaStr).toLocaleDateString('es-ES');
                } catch {
                    return fechaStr;
                }
            }
            
            container.innerHTML = `
                <div class="data-item">
                    <span>🚘 Matrícula:</span>
                    <span><strong>${datos.matricula || 'No definida'}</strong></span>
                </div>
                <div class="data-item">
                    <span>🛣️ Kilómetros:</span>
                    <span>${datos.kilometros.toLocaleString('es-ES')} km</span>
                </div>
                <div class="data-item">
                    <span>⛽ Último repostaje:</span>
                    <span>${datos.litros ? datos.litros + ' L' : 'No registrado'}</span>
                </div>
                <div class="data-item">
                    <span>✅ Próxima ITV:</span>
                    <span>${formatearFecha(datos.itv)}</span>
                </div>
                <div class="data-item">
                    <span>🛡️ Vencimiento seguro:</span>
                    <span>${formatearFecha(datos.seguro)}</span>
                </div>
                ${datos.notas ? `
                <div class="data-item">
                    <span>📝 Notas:</span>
                    <span>${datos.notas.substring(0, 50)}${datos.notas.length > 50 ? '...' : ''}</span>
                </div>
                ` : ''}
            `;
        }
        
        // Guardar en LocalStorage
        function guardarEnLocalStorage() {
            try {
                const datos = obtenerDatosDelFormulario();
                localStorage.setItem('datosVehiculo', JSON.stringify(datos));
            } catch (e) {
                console.warn("No se pudo guardar en localStorage:", e);
            }
        }
        
        // Cargar datos guardados
        function cargarDatosGuardados() {
            try {
                const datosGuardados = localStorage.getItem('datosVehiculo');
                if (datosGuardados) {
                    const datos = JSON.parse(datosGuardados);
                    cargarDatosEnFormulario(datos);
                }
            } catch (e) {
                console.warn("Error cargando datos guardados:", e);
            }
        }
        
        // Limpiar datos
        function limpiarDatos() {
            if (confirm('¿Estás seguro de querer limpiar todos los datos?')) {
                document.getElementById('matricula').value = '';
                document.getElementById('kilometros').value = '';
                document.getElementById('litros').value = '';
                document.getElementById('itv').value = '';
                document.getElementById('seguro').value = '';
                document.getElementById('notas').value = '';
                
                localStorage.removeItem('datosVehiculo');
                mostrarDatos();
                mostrarResultado('🗑️ Todos los datos han sido limpiados', 'info');
            }
        }
        
        // Mostrar resultado
        function mostrarResultado(mensaje, tipo = 'info') {
            const resultado = document.getElementById('resultado');
            resultado.innerHTML = mensaje;
            resultado.style.display = 'block';
            
            // Remover clases anteriores
            resultado.className = 'resultado';
            
            // Añadir clase según tipo
            if (tipo === 'error') {
                resultado.classList.add('error');
            } else if (tipo === 'success') {
                // success es el default
            } else {
                resultado.classList.add('info');
            }
            
            // Ocultar después de 5 segundos
            setTimeout(() => {
                resultado.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
